<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSDS HSE Library</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #eef2f7;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    padding: 20px;
    text-align: center;
}

/* LEGEND */
.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    background: white;
    padding: 10px;
}

.legend img {
    width: 30px;
    margin: 5px;
}

/* SEARCH */
.search {
    text-align: center;
    margin: 10px;
}

.search input {
    width: 90%;
    max-width: 500px;
    padding: 10px;
}

/* ✅ GRID VIEW */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 10px;
    padding: 10px;
    border-left: 8px solid #3498db;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2a5298;
    color: white;
    font-size: 13px;
    cursor: pointer;
}

/* ICONS ROW */
.icon-row {
    margin-bottom: 5px;
}

.icon-row img {
    width: 22px;
    margin-right: 4px;
}

</style>
</head>

<body>

<div class="header">
    <h2>MSDS HSE Library</h2>
    <p>Scan & Access Safety Data Sheets</p>
</div>

<!-- ✅ LEGEND -->
<div class="legend">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/GHS-pictogram-flamme.svg/100px-GHS-pictogram-flamme.svg.png" title="Flammable">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/GHS-pictogram-gas.svg/100px-GHS-pictogram-gas.svg.png" title="Gas under pressure">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/GHS-pictogram-silhouette.svg/100px-GHS-pictogram-silhouette.svg.png" title="Health hazard">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/GHS-pictogram-pollu.svg/100px-GHS-pictogram-pollu.svg.png" title="Environmental hazard">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/GHS-pictogram-oxid.svg/100px-GHS-pictogram-oxid.svg.png" title="Oxidizer">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/GHS-pictogram-acid.svg/100px-GHS-pictogram-acid.svg.png" title="Corrosive">
</div>

<div class="search">
    <input type="text" id="search" placeholder="Search..." onkeyup="filterData()">
</div>

<div class="container" id="list"></div>

<script>

// ✅ YOUR CSV LINK
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSksGapM9TAjh1gbpm6JxtidPcA9XD2gwT40anhDJCfSys4xqlNKTAZIBnuxVBzgpNZWyvMvhAWjrA/pub?gid=0&single=true&output=csv";

let dataList = [];

// ✅ GHS ICONS MAP
const ghsIcons = {
    "flammable": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/GHS-pictogram-flamme.svg/100px-GHS-pictogram-flamme.svg.png",
    "gas": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/GHS-pictogram-gas.svg/100px-GHS-pictogram-gas.svg.png",
    "health": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/GHS-pictogram-silhouette.svg/100px-GHS-pictogram-silhouette.svg.png",
    "environment": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/GHS-pictogram-pollu.svg/100px-GHS-pictogram-pollu.svg.png",
    "oxidizer": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/GHS-pictogram-oxid.svg/100px-GHS-pictogram-oxid.svg.png",
    "corrosive": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/GHS-pictogram-acid.svg/100px-GHS-pictogram-acid.svg.png"
};

// ✅ COLOR PRIORITY
function getColor(text) {
    text = text.toLowerCase();
    if (text.includes("flammable")) return "#e74c3c";
    if (text.includes("oxidizer")) return "#f39c12";
    if (text.includes("corrosive")) return "#8e44ad";
    return "#3498db";
}

// ✅ LOAD DATA
fetch(sheetURL)
.then(res => res.text())
.then(csv => {

    let rows = csv.split("\n").slice(1);

    rows.forEach(row => {

        if (!row.trim()) return;

        let cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if (!cols || cols.length < 2) return;

        let name = cols[0].replace(/"/g, "").trim();
        let url = cols[1].replace(/"/g, "").trim();
        let hazards = cols[2] ? cols[2].replace(/"/g, "").trim() : "";

        if (url.includes("drive.google.com")) {
            url = url.replace("/view", "/preview");
        }

        dataList.push({ name, url, hazards });
    });

    display(dataList);
});

// ✅ DISPLAY GRID
function display(list) {

    let container = document.getElementById("list");
    container.innerHTML = "";

    list.forEach(item => {

        let card = document.createElement("div");
        card.className = "card";
        card.style.borderLeftColor = getColor(item.hazards);

        // ✅ MULTIPLE ICONS FIXED
        let iconsHTML = "";
        let hazardsArr = item.hazards.toLowerCase().split(",");

        hazardsArr.forEach(h => {

            let text = h.trim();

            Object.keys(ghsIcons).forEach(key => {

                if (text.includes(key)) {
                    iconsHTML += `<img src="${ghsIcons[key]}" title="${text.onclick = () => {
            if (item.url) window.open(item.url, "_blank");
            else alert("MSDS not available");
        };

        card.appendChild(btn);
        container.appendChild(card);
    });
}

// ✅ SEARCH
function filterData() {

    let txt = document.getElementById("search").value.toLowerCase();

    let filtered = dataList.filter(item =>
        item.name.toLowerCase().includes(txt)
    );

    display(filtered);
}

</script>

</body>
</html>
